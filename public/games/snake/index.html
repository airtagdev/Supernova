<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title><style>
*{box-sizing:border-box}body{margin:0;background:#101713;color:#e4f1e8;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}main{width:min(92vw,480px);padding:18px 0;text-align:center}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h1{font-size:24px;letter-spacing:-1px;margin:0}#score{color:#a7c8b2;font-size:14px}canvas{display:block;width:100%;aspect-ratio:1;border:1px solid #304a3a;border-radius:12px;background:#18251d;touch-action:none}p{font-size:13px;color:#a7c8b2;min-height:20px}button{border:1px solid #476b52;border-radius:8px;color:#e4f1e8;background:#294432;font:inherit;padding:10px 22px;cursor:pointer}button:focus-visible{outline:2px solid #d4f8a9;outline-offset:3px}.pad{display:grid;grid-template-columns:repeat(3,50px);gap:6px;justify-content:center;margin:14px auto}.pad button{padding:9px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}
</style></head><body><main><header><h1>Snake</h1><span id="score" aria-live="polite">Score 0</span></header><canvas width="480" height="480" aria-label="Snake game board"></canvas><p id="status" role="status">Arrow keys or WASD to move. Space to pause.</p><button id="start">Play</button><div class="pad" aria-label="Direction controls"><button data-dir="up" aria-label="Up">↑</button><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),start=document.querySelector('#start'),score=document.querySelector('#score');
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},size=20,cell=24;
let snake,food,dir,next,running=false,paused=false,timer,points=0,changed=false;
function spawn(){const free=[];for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!snake.some(s=>s[0]===x&&s[1]===y))free.push([x,y]);return free[Math.floor(Math.random()*free.length)];}
function draw(){ctx.fillStyle='#18251d';ctx.fillRect(0,0,480,480);if(food){ctx.fillStyle='#edb779';ctx.beginPath();ctx.arc(food[0]*cell+12,food[1]*cell+12,7,0,Math.PI*2);ctx.fill();}snake.forEach((s,i)=>{ctx.fillStyle=i?'#88bc78':'#d4f8a9';ctx.fillRect(s[0]*cell+2,s[1]*cell+2,20,20);});}
function reset(){snake=[[9,10],[8,10],[7,10]];dir=[1,0];next=dir;points=0;changed=false;food=spawn();score.textContent='Score 0';draw();}
function end(message){running=false;clearInterval(timer);status.textContent=message;start.textContent='Play again';}
function tick(){if(paused)return;dir=next;changed=false;const head=[snake[0][0]+dir[0],snake[0][1]+dir[1]],eat=head[0]===food[0]&&head[1]===food[1];const body=eat?snake:snake.slice(0,-1);if(head.some(n=>n<0||n>=size)||body.some(s=>s[0]===head[0]&&s[1]===head[1]))return end('Game over. Score '+points+'.');snake.unshift(head);if(eat){points++;score.textContent='Score '+points;food=spawn();if(!food){draw();return end('You filled the board!');}}else snake.pop();draw();}
function turn(name){const d=dirs[name];if(!d||changed||d[0]===-dir[0]&&d[1]===-dir[1])return;next=d;changed=true;}
function pause(){if(!running)return;paused=!paused;status.textContent=paused?'Paused':'Arrow keys or WASD to move. Space to pause.';start.textContent=paused?'Resume':'Pause';}
start.onclick=()=>{if(running)return pause();reset();running=true;paused=false;start.textContent='Pause';status.textContent='Arrow keys or WASD to move. Space to pause.';clearInterval(timer);timer=setInterval(tick,130);};
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){e.preventDefault();turn(map[e.key]);}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();pause();}});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(b.dataset.dir));document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause();});reset();
</script></body></html>
